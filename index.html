<script>
// --- Password gate (client-side deterrent) -----------------------------------
const AUTH_KEY = 'irelandTrip.auth';
// SHA-256 of "trip-details:KellGaff26-T"
const AUTH_HASH = '7d5be86b39ecddd1fcad2ee440bccff42200d6644a15de74e55fca4be280e92a';

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function isUnlocked() {
  try { return localStorage.getItem(AUTH_KEY) === AUTH_HASH; } catch (e) { return false; }
}
function unlockUI() {
  document.body.classList.remove('auth-locked');
  const gate = document.getElementById('auth-gate');
  if (gate) gate.remove();
}
async function attemptLogin(e) {
  e.preventDefault();
  const errEl = document.getElementById('auth-error');
  const user = document.getElementById('auth-user').value.trim();
  const pass = document.getElementById('auth-pass').value;
  let hash;
  try {
    hash = await sha256Hex(user + ':' + pass);
  } catch (err) {
    errEl.textContent = 'Login needs a secure (https) connection to this page.';
    return;
  }
  if (hash === AUTH_HASH) {
    try { localStorage.setItem(AUTH_KEY, hash); } catch (e) {}
    unlockUI();
    startApp();
  } else {
    errEl.textContent = 'Wrong username or password.';
  }
}

let appStarted = false;
function startApp() {
  if (appStarted) return;
  appStarted = true;
  initSync();
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('auth-form').addEventListener('submit', attemptLogin);
  if (isUnlocked()) {
    unlockUI();
    startApp();
  } else {
    const p = document.getElementById('auth-pass');
    if (p && p.focus) p.focus();
  }
});
</script>

const CUSTOM_CATEGORY_PALETTE = ["#db2777", "#0891b2", "#65a30d", "#ea580c", "#4f46e5", "#0d9488", "#c026d3"];
let customCategories = [];
function colorForLoc(loc) {
  if (CATEGORY_LABELS[loc]) return `var(--${loc})`;
  const custom = customCategories.find(c => c.key === loc);
  return custom ? custom.color : '#6b7280';
}
function labelForLoc(loc) {
  if (CATEGORY_LABELS[loc]) return CATEGORY_LABELS[loc];
  const custom = customCategories.find(c => c.key === loc);
  return custom ? custom.label : loc;
}
function allCategoryKeys() {
  return CATEGORY_ORDER.concat(customCategories.map(c => c.key));
}
function categoryCheckboxesHtml(checkedLocs) {
  return allCategoryKeys().map(cat => `
    <label class="person-check">
      <input type="checkbox" class="edit-cat" value="${cat}" ${checkedLocs.includes(cat) ? 'checked' : ''}>
      ${escapeHtml(labelForLoc(cat))}

}
function saveCustomCategories() {
  if (firebaseReady) customCategoriesRef.set(customCategories);
}
function addCustomCategory() {
  const input = document.getElementById('new-category-name');
  const name = input.value.trim();
  if (!name) return;
  const key = 'c_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24) + '_' + Date.now().toString(36).slice(-4);
  const color = CUSTOM_CATEGORY_PALETTE[customCategories.length % CUSTOM_CATEGORY_PALETTE.length];
  const checked = Array.from(document.querySelectorAll('.edit-cat:checked')).map(cb => cb.value);
  customCategories.push({ key, label: name, color });
  saveCustomCategories();
  input.value = '';
  document.getElementById('category-checks').innerHTML = categoryCheckboxesHtml(checked.concat([key]));
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function normalizeDetail(item) {
  if (typeof item === 'string') return { text: item, place: '' };
  return { text: item.text || '', place: item.place || '' };
}
function activityListHtml(details) {
  if (!details || !details.length) return '';

  return `<ul class="day-activities">${items}</ul>`;
}
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2), 16), g = parseInt(h.substring(2,4), 16), b = parseInt(h.substring(4,6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function categoryChipsHtml(locs) {
  return `<div class="tag-chips">${locs.map(loc => {
    if (CATEGORY_LABELS[loc]) {
      return `<span class="tag-chip ${loc}">${escapeHtml(CATEGORY_LABELS[loc])}</span>`;
    }
    const color = colorForLoc(loc);
    return `<span class="tag-chip" style="color:${color};background:${hexToRgba(color, 0.12)};">${escapeHtml(labelForLoc(loc))}</span>`;
  }).join('')}</div>`;
}
function applySplitBorder(card, locs) {
  card.style.borderLeftWidth = '4px';
  card.style.borderLeftStyle = 'solid';
  if (locs.length === 1) {
    card.style.borderLeftColor = colorForLoc(locs[0]);
    return;
  }
  const stops = locs.map((loc, i) => {
    const start = Math.round((i / locs.length) * 100);
    const end = Math.round(((i + 1) / locs.length) * 100);
    const color = colorForLoc(loc);
    return `${color} ${start}%, ${color} ${end}%`;
  }).join(', ');
  card.style.borderImage = `linear-gradient(to bottom, ${stops}) 1`;
}
function isoDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), da = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function fmtShort(d) {
  return `${d.toLocaleString('en-US',{month:'short'})} ${d.getDate()}`;
}

function buildCalendar() {
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  // Monday-start grid: pad out to full weeks around the trip's date range.
  const tripStart = new Date(days[0].date + "T00:00:00");
  const tripEnd = new Date(days[days.length-1].date + "T00:00:00");
  const daysBack = (tripStart.getDay() + 6) % 7; // Mon=0 ... Sun=6
  const calStart = new Date(tripStart); calStart.setDate(calStart.getDate() - daysBack);
  const daysForward = (7 - ((tripEnd.getDay() + 6) % 7) - 1 + 7) % 7;
  const calEnd = new Date(tripEnd); calEnd.setDate(calEnd.getDate() + daysForward);

  const allDates = [];
  for (let d = new Date(calStart); d <= calEnd; d.setDate(d.getDate()+1)) {
    allDates.push(new Date(d));
  }
  const weeks = [];
  for (let i=0; i<allDates.length; i+=7) weeks.push(allDates.slice(i, i+7));

  const header = document.createElement('div');
  header.className = 'weekday-header';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(w => {
    const span = document.createElement('span');
    span.textContent = w;
    header.appendChild(span);
  });
  cal.appendChild(header);

  weeks.forEach((week, wi) => {
    const block = document.createElement('div');
    block.className = 'week-block';
    const label = document.createElement('div');
    label.className = 'week-label';
    label.textContent = `Week ${wi+1}  ·  ${fmtShort(week[0])} – ${fmtShort(week[week.length-1])}`;
    block.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'week-grid';
    week.forEach(d => {
      const day = dayMap[isoDate(d)];
      const card = document.createElement('div');
      if (day) {
        card.className = 'day-card';
        applySplitBorder(card, day.locs);
        card.onclick = () => openModal(day);
        const flightsBoxHtml = (day.flights && day.flights.length)
          ? `<div class="day-flights">${day.flights.map(f => `<div class="day-flight-line">✈ ${escapeHtml(f.num)} ${escapeHtml(f.from)}→${escapeHtml(f.to)}</div>`).join('')}</div>`
          : '';
        card.innerHTML = `
          <div class="day-date">${fmtShort(d)}</div>
          ${categoryChipsHtml(day.locs)}
          ${activityListHtml(day.details)}
          ${flightsBoxHtml}
        `;
      } else {
        card.className = 'day-card pad';
        card.innerHTML = `<div class="day-date">${fmtShort(d)}</div>`;
      }
      grid.appendChild(card);
    });
    block.appendChild(grid);
    cal.appendChild(block);
  });
}

function buildListView() {
  const container = document.getElementById('listView');
  container.innerHTML = '';
  days.forEach(day => {
    const d = new Date(day.date + "T00:00:00");

    depart: row.querySelector('.flight-depart').value.trim(),
    arrive: row.querySelector('.flight-arrive').value.trim(),
    people: Array.from(row.querySelectorAll('.person-check input:checked')).map(cb => cb.value)
  })).filter(f => f.num || f.from || f.to || f.depart || f.arrive || f.people.length);
  const details = document.getElementById('edit-details').value.split('\n')
    .map(s => s.trim()).filter(Boolean)
    .map(text => ({ text, place: '' }));
  const updated = {
    locs,
    address: document.getElementById('edit-address').value.trim(),
    addressLink: document.getElementById('edit-address-link').value.trim(),
    flights,
    details
  };
  Object.assign(day, updated);
  if (firebaseReady) overridesRef.child(dateStr).set(updated);
  buildCalendar();
  buildListView();
  buildQuickLinks();
  buildPrintView();
  renderView(day);
}
function cancelEdit(dateStr) {
  renderView(dayMap[dateStr]);
}
function closeModal() {
  document.getElementById('overlay').classList.remove('active');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function buildOpenItems() {
  const list = document.getElementById('open-items-list');
  list.innerHTML = '';
  openItems.forEach((item, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${escapeHtml(item)}</span><button class="remove-item" title="Remove" onclick="removeOpenItem(${i})">&times;</button>`;
    list.appendChild(li);
  });
}
function saveOpenItems() {
  if (firebaseReady) openItemsRef.set(openItems);
}
function removeOpenItem(i) {
  openItems.splice(i, 1);
  saveOpenItems();
  buildOpenItems();
}
function addOpenItem() {
  const input = document.getElementById('new-open-item');
  const val = input.value.trim();
  if (!val) return;
  openItems.push(val);
  saveOpenItems();
  input.value = '';
  buildOpenItems();
}

function buildPrintView() {
  const pv = document.getElementById('print-view');
  let html = `<h1>Gaffney-Kelleher Family Ireland Trip — Aug 28 – Sep 15, 2026</h1>
    <p style="color:#555;font-size:0.85rem;">Who's going: Maura, Mom, Dad, Thomas, Aidan, Ryan, Aunt Mary</p>`;
  days.forEach(day => {
    const d = new Date(day.date + "T00:00:00");
    const fullDate = d.toLocaleString('en-US',{ weekday:'long', month:'long', day:'numeric' });
    const addressLine = day.address
      ? `<div class="pd-meta">Accommodation: ${escapeHtml(day.address)}${day.addressLink ? ' (Booking: ' + escapeHtml(day.addressLink) + ')' : ''}</div>`
      : '';
    const flightLines = (day.flights && day.flights.length)
      ? `<ul class="pd-flights">${day.flights.map(f => `<li>${escapeHtml(f.num)}: ${escapeHtml(f.from)} → ${escapeHtml(f.to)}, ${escapeHtml(f.depart)} → ${escapeHtml(f.arrive)}${(f.people && f.people.length) ? ' — ' + escapeHtml(f.people.join(', ')) : ''}</li>`).join('')}</ul>`
      : '';
    const detailLines = day.details.map(item => {
      const n = normalizeDetail(item);
      return `<li>${escapeHtml(n.text)}${n.place ? ' (' + escapeHtml(n.place) + ')' : ''}</li>`;
    }).join('');
    const tagText = day.locs.map(loc => CATEGORY_LABELS[loc] || loc).join(' & ');
    html += `<div class="print-day">
      <h3>${fullDate} — ${escapeHtml(tagText)}</h3>
      ${addressLine}
      ${flightLines}
      <ul>${detailLines}</ul>
    </div>`;
  });
  pv.innerHTML = html;
}

function initSync() {
  let savedView = 'calendar';
  try { savedView = localStorage.getItem(VIEW_MODE_KEY) || 'calendar'; } catch (e) {}

  if (FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") {
    console.warn('Firebase sync not configured — running locally only. Fill in FIREBASE_CONFIG to enable shared editing.');
    buildCalendar();
    buildListView();
    buildQuickLinks();
    buildPrintView();
    buildOpenItems();
    setView(savedView);
    return;
  }

  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  overridesRef = db.ref('trip/dayOverrides');
  openItemsRef = db.ref('trip/openItems');
  customCategoriesRef = db.ref('trip/customCategories');
  firebaseReady = true;

  overridesRef.on('value', snapshot => {
    applyOverrides(snapshot.val() || {});
    buildCalendar();
    buildListView();
    buildQuickLinks();
    buildPrintView();
    setView(savedView);
  });

  openItemsRef.on('value', snapshot => {
    const val = snapshot.val();
    openItems = Array.isArray(val) ? val : defaultOpenItems.slice();
    buildOpenItems();
  });

  customCategoriesRef.on('value', snapshot => {
    const val = snapshot.val();
    customCategories = Array.isArray(val) ? val : [];
    buildCalendar();
    buildListView();
  });
}

// App bootstrap is gated: startApp() -> initSync() runs only after a successful
// login (or when this browser already holds a valid unlock token). See the
// password-gate script above.
if (isUnlocked()) startApp();
</script>
